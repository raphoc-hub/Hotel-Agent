<!doctype html>
<!-- This page has no login yet: anyone who can open /staff can read every guest request. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff: guest requests</title>
  <style>
    :root { --navy: #1B2A41; --accent: #C8553D; --muted: #5E6A7C; --line: #D5DAE1; --wash: #F4F6F8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 16px 24px; font-family: system-ui, sans-serif; font-size: 13px; color: var(--navy); background: #FFFFFF; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; }
    #updated { color: var(--muted); }

    /* Counts */
    .stats { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
    .stat { border: 1px solid var(--line); padding: 4px 10px; min-width: 96px; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat.alert b { color: var(--accent); }

    /* Filters and search */
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .filters button { font: inherit; padding: 3px 10px; border: 1px solid var(--line); background: #FFFFFF; color: inherit; cursor: pointer; }
    .filters button.active { background: var(--navy); border-color: var(--navy); color: #FFFFFF; }
    #search { font: inherit; padding: 3px 8px; border: 1px solid var(--line); width: 240px; max-width: 100%; }
    #count { color: var(--muted); }

    /* Table and trace side by side; the trace goes below on narrow screens */
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 8px; }
    .workspace.with-trace { grid-template-columns: minmax(0, 1fr) 380px; }
    .table-wrap { overflow: auto; max-height: calc(100vh - 170px); border: 1px solid var(--line); }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
    th { background: var(--wash); position: sticky; top: 0; font-weight: 600; white-space: nowrap; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--wash); }
    tbody tr.selected { background: #FBEAE6; }
    td.time, td.status, td.urgency { white-space: nowrap; }
    td.message, td.reply { min-width: 220px; }
    .ESCALATED { color: var(--accent); font-weight: 600; }
    .high { color: var(--accent); font-weight: 600; }
    td.note { color: var(--accent); }
    .empty { padding: 24px; color: var(--muted); text-align: center; }

    /* Trace */
    #trace { border: 1px solid var(--line); padding: 8px 10px; overflow: auto; max-height: calc(100vh - 170px); }
    #trace h2 { font-size: 13px; margin: 0 0 2px; }
    #trace .sub { color: var(--muted); margin: 0 0 8px; }
    #trace ol { margin: 0; padding: 0; list-style: none; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    #trace li { padding: 3px 0 3px 10px; border-left: 2px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
    #trace li.model { border-left-color: var(--navy); }
    #trace li.tool { border-left-color: var(--accent); margin-left: 12px; }
    #trace li.answer { border-left-color: var(--muted); }
    #trace .close { float: right; font: inherit; border: 1px solid var(--line); background: #FFFFFF; cursor: pointer; }
    @media (max-width: 900px) { .workspace.with-trace { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>Hotel Estrella: guest requests</h1>
    <span id="updated"></span>
  </header>

  <div class="stats">
    <div class="stat"><span>All</span><b id="stat-all">0</b></div>
    <div class="stat alert"><span>Escalated</span><b id="stat-escalated">0</b></div>
    <div class="stat alert"><span>High urgency</span><b id="stat-high">0</b></div>
    <div class="stat"><span>Answered</span><b id="stat-answered">0</b></div>
  </div>

  <div class="controls">
    <div class="filters">
      <button data-filter="ALL" class="active">All</button>
      <button data-filter="ESCALATED">Escalated</button>
      <button data-filter="ANSWERED">Answered</button>
    </div>
    <input id="search" type="search" placeholder="Search name, e-mail, message, department" aria-label="Search">
    <span id="count"></span>
  </div>

  <div class="workspace" id="workspace">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Time</th><th>Name</th><th>Email</th><th>Message</th><th>Department</th><th>Urgency</th><th>Status</th><th>Reply</th><th>Note</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <aside id="trace" hidden></aside>
  </div>

  <script>
    let requests = [];
    let filter = "ALL";
    let search = "";
    let selectedTime = null; // the request whose trace is open

    // One readable line per trace entry.
    function traceLine(entry) {
      if (entry.type === "model") {
        return `Step ${entry.step}: model call, stop reason ${entry.stop_reason}, asked for a tool: ${entry.asked_for_tool ? "yes" : "no"}`;
      }
      if (entry.type === "tool") {
        const stub = entry.stubbed ? " (stubbed)" : "";
        return `Tool ${entry.name}${stub} ${JSON.stringify(entry.arguments)} -> ${entry.result}`;
      }
      if (entry.type === "answer") return `Final answer: ${entry.text}`;
      return JSON.stringify(entry);
    }

    function showTrace(request) {
      selectedTime = request.time;
      const box = document.getElementById("trace");
      box.textContent = "";

      const close = document.createElement("button");
      close.className = "close";
      close.textContent = "Close";
      close.addEventListener("click", hideTrace);

      const title = document.createElement("h2");
      title.textContent = `Trace: ${request.name}`;
      const sub = document.createElement("p");
      sub.className = "sub";
      const steps = (request.trace || []).filter((e) => e.type === "model").length;
      sub.textContent = `${new Date(request.time).toLocaleString("en-GB")} · ${steps} model call${steps === 1 ? "" : "s"}`;

      const list = document.createElement("ol");
      for (const entry of request.trace || []) {
        const li = document.createElement("li");
        li.className = entry.type;
        li.textContent = traceLine(entry); // textContent: guest text is never treated as HTML
        list.appendChild(li);
      }
      if (request.note) {
        const li = document.createElement("li");
        li.textContent = `Note: ${request.note}`;
        list.appendChild(li);
      }
      if (!list.children.length) list.textContent = "No trace saved.";

      box.append(close, title, sub, list);
      box.hidden = false;
      document.getElementById("workspace").classList.add("with-trace");
      render();
    }

    function hideTrace() {
      selectedTime = null;
      document.getElementById("trace").hidden = true;
      document.getElementById("workspace").classList.remove("with-trace");
      render();
    }

    function matches(request) {
      if (filter !== "ALL" && request.status !== filter) return false;
      if (!search) return true;
      const text = [request.name, request.email, request.message, request.department, request.summary, request.reply].join(" ").toLowerCase();
      return text.includes(search);
    }

    function render() {
      document.getElementById("stat-all").textContent = requests.length;
      document.getElementById("stat-escalated").textContent = requests.filter((r) => r.status === "ESCALATED").length;
      document.getElementById("stat-high").textContent = requests.filter((r) => r.urgency === "high").length;
      document.getElementById("stat-answered").textContent = requests.filter((r) => r.status === "ANSWERED").length;

      const tbody = document.getElementById("rows");
      tbody.textContent = "";
      const shown = requests.filter(matches);
      for (const request of shown) {
        const tr = document.createElement("tr");
        if (request.time === selectedTime) tr.classList.add("selected");
        const cells = [
          ["time", new Date(request.time).toLocaleString("en-GB")],
          ["name", request.name],
          ["email", request.email],
          ["message", request.message],
          ["department", request.department],
          ["urgency " + (request.urgency || ""), request.urgency],
          ["status " + (request.status || ""), request.status],
          ["reply", request.reply],
          ["note", request.note],
        ];
        for (const [className, value] of cells) {
          const td = document.createElement("td");
          td.className = className;
          td.textContent = value || ""; // textContent: guest text is never treated as HTML
          tr.appendChild(td);
        }
        tr.addEventListener("click", () => showTrace(request));
        tbody.appendChild(tr);
      }
      if (!shown.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 9;
        td.className = "empty";
        td.textContent = requests.length ? "No requests match." : "No requests yet.";
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
      document.getElementById("count").textContent = `${shown.length} of ${requests.length}`;
    }

    async function load() {
      try {
        const response = await fetch("/api/requests");
        requests = await response.json();
        render();
        document.getElementById("updated").textContent =
          `Updated ${new Date().toLocaleTimeString("en-GB")} · refreshes every 15 seconds`;
      } catch {
        document.getElementById("updated").textContent = "Could not load the requests.";
      }
    }

    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll(".filters button").forEach((b) => b.classList.toggle("active", b === button));
        render();
      });
    });
    document.getElementById("search").addEventListener("input", (event) => {
      search = event.target.value.trim().toLowerCase();
      render();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") hideTrace();
    });

    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
